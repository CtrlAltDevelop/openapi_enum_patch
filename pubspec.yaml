name: openapi_enum_patch
description: >-
  Give real names to the integer enums swagger_parser generates from OpenAPI,
  fill in the enum files it skips, and audit which enums still need naming.
version: 0.1.0
repository: https://github.com/CtrlAltDevelop/openapi_enum_patch
issue_tracker: https://github.com/CtrlAltDevelop/openapi_enum_patch/issues

topics:
  - openapi
  - swagger
  - codegen
  - enums

environment:
  sdk: ^3.6.0

dependencies:
  args: ^2.6.0
  meta: ^1.16.0
  path: ^1.9.0
  yaml: ^3.1.2

dev_dependencies:
  lints: ^5.1.0
  test: ^1.25.0

executables:
  openapi_enum_patch:
