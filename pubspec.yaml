name: openapi_enum_patch
description: >-
  Prepare an OpenAPI export for code generation, give real names to the integer
  enums swagger_parser generates from it, fill in the enum files it skips, and
  audit which enums still need naming.
version: 1.2.0
repository: https://github.com/CtrlAltDevelop/openapi_enum_patch
issue_tracker: https://github.com/CtrlAltDevelop/openapi_enum_patch/issues

topics:
  - openapi
  - swagger
  - codegen
  - enums

environment:
  sdk: ^3.13.0

dependencies:
  args: ^2.7.0
  meta: ^1.19.0
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.2

executables:
  openapi_enum_patch:
